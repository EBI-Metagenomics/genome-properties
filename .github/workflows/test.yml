name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Perl tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --file Dockerfile.test --tag genome-properties-tests .

      - name: Run tests
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=64m
          genome-properties-tests
